# premarket-ai: run with `podman compose` in Ubuntu WSL.
# Increment 0 (legacy baseline): postgres, vendor-sim and the C++11 legacy
# ingester/report. Increment 1 (web instead of PDF): redis, ai-api, two web
# replicas and the edge proxy in front of them.
# Profiles: legacy (inc 0+), ai (inc 1+), observability, full.
#   podman compose --profile legacy --profile ai up -d
# Ollama is not a service: it runs on the GPU host (from increment 3).
#
# Only `edge` publishes a port. Browsers reach the UI and the API through it:
#   browser -> edge (rate limits, security headers, load balancing)
#                ├── /      -> web-1 | web-2   (static UI)
#                └── /api/  -> ai-api          (auth, news) -> postgres, redis

name: premarket-ai

x-pg-env: &pg-env
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: premarket
  PGUSER: premarket
  PGPASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}

# Container hardening for the increment 1 services: no root filesystem
# writes, no Linux capabilities, no privilege escalation (setuid).
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256

# Settings shared by the two UI replicas.
x-web: &web
  profiles: [ai, full]
  build:
    context: ./ui/web
    dockerfile: ../../podman/web/Containerfile
    target: runtime
  image: localhost/premarket-ai/web:dev
  <<: *hardened
  tmpfs:
    - /tmp:size=16m,mode=1777
  mem_limit: 64m
  volumes:
    - ./podman/config/web/default.conf:/etc/nginx/conf.d/default.conf:ro
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
    interval: 10s
    timeout: 3s
    retries: 5
  restart: unless-stopped

services:
  postgres:
    image: docker.io/pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: premarket
      POSTGRES_USER: premarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Legacy DDL + seed, run once when pgdata is first created.
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U premarket -d premarket"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  vendor-sim:
    build:
      context: ./python/vendor-sim
      dockerfile: ../../podman/vendor-sim/Containerfile
      target: runtime
    image: localhost/premarket-ai/vendor-sim:dev
    environment:
      VENDOR_SEED: ${VENDOR_SEED:-42}
      VENDOR_MIX: ${VENDOR_MIX:-}
    volumes:
      # labels.jsonl per day (ground truth for the eval harness, inc 2+).
      - vendor-data:/data
    healthcheck:
      # No spaces inside arguments: Podman re-splits healthcheck commands.
      test: ["CMD", "vendor-sim", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  legacy:
    profiles: [legacy, full]
    build:
      context: ./cpp/legacy
      dockerfile: ../../podman/legacy/Containerfile
      target: runtime
    image: localhost/premarket-ai/legacy:dev
    depends_on:
      postgres:
        condition: service_healthy
      vendor-sim:
        condition: service_healthy
    environment:
      <<: *pg-env
      TZ: America/New_York
      VENDOR_FEED_URL: http://vendor-sim:8080/feed
      LEGACY_WORKERS: ${LEGACY_WORKERS:-4}
      LEGACY_QUEUE_CAPACITY: ${LEGACY_QUEUE_CAPACITY:-64}
      LEGACY_DEDUP_WINDOW_DAYS: ${LEGACY_DEDUP_WINDOW_DAYS:-7}
    volumes:
      # Simulates the NFS share traders open the PDF from.
      - nfs-reports:/nfs/reports
      - ./podman/config/legacy/crontab:/etc/premarket/crontab:ro
    restart: unless-stopped

  # --- increment 1: web instead of PDF ---------------------------------------
  # Sessions and login throttling. Temporary state only: no persistence, and
  # losing it just logs everyone out.
  redis:
    profiles: [ai, full]
    image: docker.io/library/redis:8.10.2-alpine
    user: redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?run make -C python env}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - volatile-lru
      # Nothing in the app needs these; an attacker would.
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?run make -C python env}
    <<: *hardened
    tmpfs:
      - /data:size=8m,mode=1777
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot, as the database owner: Alembic migrations (ai schema), the
  # API's least-privilege role and the demo users. ai-api waits for it.
  ai-api-init:
    profiles: [ai, full]
    image: localhost/premarket-ai/ai-api:dev
    command: ["ai-api", "init"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *pg-env
      AI_DB_USER: premarket_ai
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?run make -C python env}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?copy it from .env.example}
    <<: *hardened
    tmpfs:
      - /tmp:size=16m
    restart: "no"

  # FastAPI: /auth/*, /news, /news/{id}, /health. Not published: only the
  # edge proxy reaches it. Connects as premarket_ai, which can read the
  # legacy tables and users and append audit rows, nothing else.
  ai-api:
    profiles: [ai, full]
    build:
      context: ./python/ai-api
      dockerfile: ../../podman/ai-api/Containerfile
      target: runtime
    image: localhost/premarket-ai/ai-api:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-api-init:
        condition: service_completed_successfully
    environment:
      TZ: UTC
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: premarket
      AI_DB_USER: premarket_ai
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?run make -C python env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run make -C python env}
      JWT_SECRET: ${JWT_SECRET:?run make -C python env}
      ACCESS_TOKEN_TTL_S: ${ACCESS_TOKEN_TTL_S:-900}
      REFRESH_TOKEN_TTL_S: ${REFRESH_TOKEN_TTL_S:-43200}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCKOUT_S: ${LOGIN_LOCKOUT_S:-900}
      # Browser origins allowed to call /auth/* (CSRF check): the edge, and
      # the Vite dev server of `make -C ui dev VITE_API_MODE=live`.
      ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8080},http://127.0.0.1:${WEB_PORT:-8080},http://localhost:5173
    <<: *hardened
    tmpfs:
      - /tmp:size=16m
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "ai-api", "health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Two replicas of the static UI, load balanced by the edge.
  web-1:
    <<: *web
  web-2:
    <<: *web

  # nginx in front of everything: rate limits, request limits, security
  # headers (CSP...), JSON errors, and the load balancer for web-1/web-2.
  edge:
    profiles: [ai, full]
    image: docker.io/nginxinc/nginx-unprivileged:1.30.5-alpine
    depends_on:
      web-1:
        condition: service_healthy
      web-2:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    ports:
      # Loopback only by default; WEB_BIND=0.0.0.0 exposes it on the LAN.
      - ${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080
    environment:
      # The entrypoint exports the container's DNS server and renders
      # templates/edge.conf.template into /tmp/edge.conf with only that
      # variable replaced (nginx's own $variables are left alone).
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
      NGINX_ENVSUBST_FILTER: ^NGINX_LOCAL_RESOLVERS$$
    volumes:
      - ./podman/config/edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./podman/config/edge/templates:/etc/nginx/templates:ro
      - ./podman/config/edge/snippets:/etc/nginx/snippets:ro
    <<: *hardened
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/edge-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  vendor-data:
  nfs-reports:
