# premarket-ai web replica (web-1, web-2): static UI files only.
# Mounted read-only at /etc/nginx/conf.d/default.conf. Not published: only
# the edge proxy reaches it, and the edge adds the security headers.

server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    autoindex off;
    disable_symlinks on;
    client_max_body_size 1k;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml
               application/json font/woff2;
    gzip_min_length 1024;

    # For the edge proxy and the compose healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed file names: cache forever. A missing asset is a 404, never
    # index.html served as JavaScript.
    location /assets/ {
        limit_except GET { deny all; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    # Single-page app: unknown paths get index.html, which is revalidated
    # on every load so a release shows up at once.
    location / {
        limit_except GET { deny all; }
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
