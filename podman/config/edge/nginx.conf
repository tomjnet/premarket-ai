# premarket-ai edge: main nginx config (mounted read-only at
# /etc/nginx/nginx.conf). The root filesystem is read-only; everything that
# nginx writes (pid, temp files, the rendered site config) lives in /tmp.
#
# The image's entrypoint renders templates/edge.conf.template into
# /tmp/edge.conf at start, filling in the container's DNS server
# (NGINX_LOCAL_RESOLVERS), so the upstreams are re-resolved at runtime.

worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    sendfile on;
    server_tokens off;

    include /tmp/edge.conf;
}
