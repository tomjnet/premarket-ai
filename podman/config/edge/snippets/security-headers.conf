# premarket-ai edge: security headers of the web pages.
# Included in `location /` only: in nginx, a location with its own
# add_header drops the server-level ones, so they live here explicitly.
# (API responses carry their own, stricter headers from ai-api.)

# CSP: only our own scripts, styles, fonts and API. No inline code, no
# eval, no framing, no plugins. Trusted Types: the DOM refuses HTML strings,
# which closes the usual XSS sinks (innerHTML...) even if a bug slipped in.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; require-trusted-types-for 'script'; trusted-types 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Origin-Agent-Cluster "?1" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
# Strict-Transport-Security is added when the edge serves HTTPS
# (increment 6); on plain http://localhost it would be ignored.
