# premarket-ai edge: settings shared by every proxied location.

proxy_http_version 1.1;
# Keep-alive to the upstream pool.
proxy_set_header Connection "";
proxy_set_header Host $host;
# Overwritten, never appended: a client can't forge its own address in the
# audit log.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Upstreams are on the local container network: a replica that does not
# accept within 1 s is down, and the request moves to the other one.
proxy_connect_timeout 1s;
proxy_send_timeout 15s;
proxy_read_timeout 30s;

# A replica that is down: try the other one. POST is never retried
# (non_idempotent is not listed), so a login is never sent twice.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 5s;

proxy_hide_header X-Powered-By;
proxy_hide_header Server;
# Belt and braces: whatever an upstream sets, cookies leave the edge as
# Secure, HttpOnly and SameSite=Strict.
proxy_cookie_flags ~ secure httponly samesite=strict;
