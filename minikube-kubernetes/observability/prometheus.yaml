# prometheus | Prometheus 3
# Metrics store: scrapes otel-collector:8889 and scheduler:9464 (short
# names resolve through the pod's DNS search domains).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.15.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=$(PROMETHEUS_RETENTION)
            - --web.listen-address=:9090
          env:
            - name: PROMETHEUS_RETENTION
              valueFrom:
                configMapKeyRef: {name: premarket-settings, key: PROMETHEUS_RETENTION}
          ports:
            - containerPort: 9090
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 512Mi}
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
