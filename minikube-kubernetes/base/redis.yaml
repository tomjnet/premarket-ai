# redis | Redis 8 (in-memory only)
# Sessions, login throttling, dedup index, job streams, chat cache.
# No persistence: losing it just logs everyone out.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        # compose `user: redis` (uid 999, gid 1000 in the alpine image).
        runAsUser: 999
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: redis
          image: docker.io/library/redis:8.10.2-alpine
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: premarket-env, key: REDIS_PASSWORD}
            - name: REDISCLI_AUTH
              value: $(REDIS_PASSWORD)
          args:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 64mb
            - --maxmemory-policy
            - volatile-lru
            # Nothing in the app needs these; an attacker would.
            - --rename-command
            - CONFIG
            - ""
            - --rename-command
            - FLUSHALL
            - ""
            - --rename-command
            - FLUSHDB
            - ""
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {memory: 64Mi, cpu: 50m}
            limits: {memory: 128Mi}
      volumes:
        - name: data
          emptyDir: {medium: Memory, sizeLimit: 8Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
