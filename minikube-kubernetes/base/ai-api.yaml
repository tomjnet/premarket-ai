# ai-api | Python 3, FastAPI, LangChain/LangGraph, psycopg
# Backend API: auth, news, chat agents, runs, review, briefs, watchlists.
# Not exposed: only the edge reaches it. Connects as premarket_ai.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-api
  template:
    metadata:
      labels:
        app: ai-api
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      initContainers:
        # compose: postgres and redis healthy, ai-api-init completed. The
        # role premarket_ai can log in only once the init has finished.
        - name: wait-init
          image: docker.io/pgvector/pgvector:0.8.0-pg17
          command:
            - bash
            - -c
            - |
              until PGPASSWORD="$AI_DB_PASSWORD" psql -h postgres -U premarket_ai -d premarket -tAc 'SELECT 1' >/dev/null 2>&1; do
                echo "waiting for ai-api-init"; sleep 3
              done
              until (exec 3<>/dev/tcp/redis/6379) 2>/dev/null; do sleep 2; done
          env:
            - name: AI_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: premarket-env, key: AI_DB_PASSWORD}
          securityContext:
            runAsUser: 999
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      containers:
        - name: ai-api
          image: localhost/premarket-ai/ai-api:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: premarket-settings
          env:
            - name: TZ
              value: UTC
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: premarket
            - name: AI_DB_USER
              value: premarket_ai
            - name: AI_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: premarket-env, key: AI_DB_PASSWORD}
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: premarket-env, key: REDIS_PASSWORD}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: premarket-env, key: JWT_SECRET}
            # Browser origins allowed to call /auth/*: the edge through
            # `kubectl port-forward` (localhost:WEB_PORT), and the Vite dev
            # server.
            - name: ALLOWED_ORIGINS
              value: http://localhost:$(WEB_PORT),http://127.0.0.1:$(WEB_PORT),http://localhost:5173
            - name: MCP_URL
              value: http://mcp-server:8000/mcp
            - name: MCP_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: premarket-env, key: MCP_SERVICE_TOKEN}
            - name: ALERT_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef: {name: premarket-env, key: ALERT_WEBHOOK_TOKEN}
            # x-ai-env
            - name: LLM_GATEWAY_KEY_RAW
              valueFrom:
                secretKeyRef: {name: premarket-env, key: LLM_GATEWAY_KEY}
            - name: LLM_GATEWAY_URL
              value: http://llm-gateway:4000/v1
            - name: LLM_GATEWAY_KEY
              value: sk-$(LLM_GATEWAY_KEY_RAW)
            - name: CHROMA_HOST
              value: chroma
            - name: CHROMA_PORT
              value: "8000"
            - name: RERANKER_URL
              value: http://reranker:8080
            - name: LANGFUSE_KEY_ID
              valueFrom:
                secretKeyRef: {name: premarket-env, key: LANGFUSE_KEY_ID, optional: true}
            - name: LANGFUSE_SECRET
              valueFrom:
                secretKeyRef: {name: premarket-env, key: LANGFUSE_SECRET, optional: true}
            - name: LANGFUSE_HOST
              value: http://langfuse-web:3000
            - name: LANGFUSE_PUBLIC_KEY
              value: pk-lf-$(LANGFUSE_KEY_ID)
            - name: LANGFUSE_SECRET_KEY
              value: sk-lf-$(LANGFUSE_SECRET)
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["ai-api", "health"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["ai-api", "health"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests: {memory: 256Mi, cpu: 100m}
            limits: {memory: 768Mi}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-api
spec:
  selector:
    app: ai-api
  ports:
    - port: 8000
      targetPort: 8000
