# web-1, web-2 | React 19, TypeScript, Vite, served by nginx
# Two replicas of the static UI, load balanced by the edge (least_conn,
# failover). They stay two Deployments + Services, like compose, because
# the edge's upstream lists web-1 and web-2 by name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-1
  template:
    metadata:
      labels:
        app: web-1
        premarket-ai/role: web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: web
          image: localhost/premarket-ai/web:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: web-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {memory: 16Mi, cpu: 10m}
            limits: {memory: 64Mi}
      volumes:
        - name: web-config
          configMap:
            name: web-config
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-2
  template:
    metadata:
      labels:
        app: web-2
        premarket-ai/role: web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: web
          image: localhost/premarket-ai/web:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: web-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {memory: 16Mi, cpu: 10m}
            limits: {memory: 64Mi}
      volumes:
        - name: web-config
          configMap:
            name: web-config
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web-1
spec:
  selector:
    app: web-1
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-2
spec:
  selector:
    app: web-2
  ports:
    - port: 8080
      targetPort: 8080
