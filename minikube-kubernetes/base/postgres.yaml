# postgres | PostgreSQL 17 + pgvector 0.8
# Main database: raw news, ingest.* and ai.* schemas, users, RAG vectors.
# The sql/ scripts run once, when the pgdata volume is first created.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: postgres
          image: docker.io/pgvector/pgvector:0.8.0-pg17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: premarket
            - name: POSTGRES_USER
              value: premarket
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: premarket-env, key: POSTGRES_PASSWORD}
            - name: TZ
              value: UTC
            # A subfolder: the volume's root may hold lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: sql-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "premarket", "-d", "premarket"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "premarket", "-d", "premarket"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: {memory: 256Mi, cpu: 100m}
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata
        - name: sql-init
          configMap:
            name: sql-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
