# searxng | SearXNG
# Self-hosted metasearch engine behind the MCP `web_search` tool. Only
# mcp-server calls it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:2026.9.25-12f8b6515
          ports:
            - containerPort: 8080
          env:
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef: {name: premarket-env, key: SEARXNG_SECRET}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: config
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
            - name: cache
              mountPath: /var/cache/searxng
          readinessProbe:
            exec:
              command: ["python3", "-c", "__import__('urllib.request').request.urlopen('http://127.0.0.1:8080/healthz')"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["python3", "-c", "__import__('urllib.request').request.urlopen('http://127.0.0.1:8080/healthz')"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: {memory: 128Mi, cpu: 50m}
            limits: {memory: 512Mi}
      volumes:
        - name: config
          configMap:
            name: searxng-config
        - name: cache
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
spec:
  selector:
    app: searxng
  ports:
    - port: 8080
      targetPort: 8080
