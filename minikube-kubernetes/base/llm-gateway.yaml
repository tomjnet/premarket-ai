# llm-gateway | LiteLLM proxy
# One OpenAI-compatible LLM endpoint for Ollama on the GPU host and the
# cloud providers (task aliases in podman/config/litellm/config.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: llm-gateway
          image: docker.io/litellm/litellm:v1.102.1
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
          env:
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef: {name: premarket-settings, key: OLLAMA_BASE_URL}
            - name: LLM_GATEWAY_KEY_RAW
              valueFrom:
                secretKeyRef: {name: premarket-env, key: LLM_GATEWAY_KEY}
            - name: LITELLM_MASTER_KEY
              value: sk-$(LLM_GATEWAY_KEY_RAW)
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: premarket-env, key: OPENAI_API_KEY, optional: true}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: premarket-env, key: ANTHROPIC_API_KEY, optional: true}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: {name: premarket-env, key: GEMINI_API_KEY, optional: true}
            - name: LITELLM_LOG
              value: ERROR
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command: ["python3", "-c", "__import__('urllib.request').request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["python3", "-c", "__import__('urllib.request').request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {memory: 512Mi, cpu: 100m}
            limits: {memory: 1Gi}
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
spec:
  selector:
    app: llm-gateway
  ports:
    - port: 4000
      targetPort: 4000
