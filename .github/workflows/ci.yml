# Hosted-runner CI: no GPU, no secrets. Every job builds a Containerfile
# stage with Podman, exactly like `make -C python <task>` does locally.
name: ci

on:
  push:
    branches: [main, "inc-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor-sim:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stage: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - name: vendor-sim ${{ matrix.stage }}
        run: >
          podman build -f podman/vendor-sim/Containerfile
          --target ${{ matrix.stage }}
          --build-context config=python/config python/vendor-sim

  legacy-cpp:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stage: [test, lint, asan, tsan, runtime]
    steps:
      - uses: actions/checkout@v4
      - name: Allow ThreadSanitizer's memory layout
        if: matrix.stage == 'tsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: legacy ${{ matrix.stage }}
        run: >
          podman build -f podman/legacy/Containerfile
          --target ${{ matrix.stage }} cpp/legacy

  # C++20 modern ingester (increment 2). Parity with legacy needs a
  # database, so it's checked by `make -C python demo`, not here.
  ingest-cpp:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stage: [test, lint, asan, tsan, runtime]
    steps:
      - uses: actions/checkout@v4
      - name: Allow ThreadSanitizer's memory layout
        if: matrix.stage == 'tsan'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      # seccomp=unconfined: the tsan stage runs ctest with ASLR off.
      - name: ingest ${{ matrix.stage }}
        run: >
          podman build -f podman/ingest/Containerfile
          --security-opt seccomp=unconfined
          --target ${{ matrix.stage }} cpp/ingest

  # ai-api with the C++20 fastpath module: C++ stages, pytest (including
  # the C++ vs Python parity tests), ruff, and the evals of the
  # deterministic layers (rules, dedup, and the rules-only verdicts of
  # eval harness v2), so they run on hosted runners.
  ai-api:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stage:
          - fastpath-test
          - fastpath-lint
          - fastpath-asan
          - test
          - lint
          - eval
          # Increment 3: the GPU evals' image (run by gpu-evals.yml).
          - ai-eval
          # Increment 4: the verification worker (with CPU torch).
          - worker
          - runtime
    steps:
      - uses: actions/checkout@v4
      - name: ai-api ${{ matrix.stage }}
        run: >
          podman build -f podman/ai-api/Containerfile
          --target ${{ matrix.stage }}
          --build-context fastpath=cpp/fastpath
          --build-context config=python/config
          --build-context vendorsim=python/vendor-sim
          --build-context skills=python/skills python/ai-api

  # Increment 4: the MCP server (read-only tools, SSRF guard, token).
  mcp-server:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stage: [test, lint, runtime]
    steps:
      - uses: actions/checkout@v4
      - name: mcp-server ${{ matrix.stage }}
        run: >
          podman build -f podman/mcp-server/Containerfile
          --target ${{ matrix.stage }}
          --build-context config=python/config python/mcp-server

  # Increment 6: the scheduler is built on the ai-api image (it runs the
  # ai-api commands), so the job builds that image first.
  scheduler:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stage: [test, lint, runtime]
    steps:
      - uses: actions/checkout@v4
      - name: ai-api runtime (the scheduler's base image)
        run: >
          podman build -f podman/ai-api/Containerfile --target runtime
          -t localhost/premarket-ai/ai-api:dev
          --build-context fastpath=cpp/fastpath
          --build-context config=python/config
          --build-context vendorsim=python/vendor-sim
          --build-context skills=python/skills python/ai-api
      - name: scheduler ${{ matrix.stage }}
        run: >
          podman build -f podman/scheduler/Containerfile
          --target ${{ matrix.stage }}
          --build-arg AI_API_IMAGE=localhost/premarket-ai/ai-api:dev
          python/scheduler

  # Increment 6: the observability profile's configs.
  observability-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: OpenTelemetry Collector config
        run: >
          podman run --rm
          -v $PWD/podman/config/otel/config.yaml:/etc/otelcol/config.yaml:ro
          docker.io/otel/opentelemetry-collector-contrib:0.160.0
          validate --config=/etc/otelcol/config.yaml
      - name: Prometheus config
        run: >
          podman run --rm --entrypoint promtool
          -v $PWD/podman/config/prometheus:/p:ro
          docker.io/prom/prometheus:v3.15.0 check config /p/prometheus.yml
      - name: Grafana dashboard is valid JSON
        run: python3 -m json.tool podman/config/grafana/dashboards/premarket-operations.json > /dev/null

  # Increment 6: no secret in any commit (the whole history).
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          podman run --rm -v $PWD:/repo:ro
          docker.io/zricethezav/gitleaks:v8.30.1
          git --redact --no-banner /repo

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: UI lint, typecheck, tests, build (no MSW in dist)
        run: make -C ui check
      - name: Web image (production bundle + nginx)
        run: >
          podman build -f podman/web/Containerfile --target runtime
          -t localhost/premarket-ai/web:ci ui/web
      - name: Web replica nginx config
        run: >
          podman run --rm --read-only --tmpfs /tmp
          -v $PWD/podman/config/web/default.conf:/etc/nginx/conf.d/default.conf:ro
          localhost/premarket-ai/web:ci nginx -t

  edge-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Edge nginx config (rendered template, read-only root)
        run: >
          podman run --rm --read-only --tmpfs /tmp
          -e NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1
          -e NGINX_ENVSUBST_OUTPUT_DIR=/tmp
          -e 'NGINX_ENVSUBST_FILTER=^NGINX_LOCAL_RESOLVERS$'
          -v $PWD/podman/config/edge/nginx.conf:/etc/nginx/nginx.conf:ro
          -v $PWD/podman/config/edge/templates:/etc/nginx/templates:ro
          -v $PWD/podman/config/edge/snippets:/etc/nginx/snippets:ro
          docker.io/nginxinc/nginx-unprivileged:1.30.5-alpine nginx -t

  compose-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose.yaml
        run: |
          # .env.example leaves the secrets empty; `env` generates them.
          make -C python env
          docker compose --profile full --profile legacy config --quiet
