[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "premarket-ai-api"
version = "0.1.0"
description = "premarket-ai backend: auth, the news feed, rule checks and first AI"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "psycopg[binary]==3.3.6",
  "psycopg-pool==3.3.3",
  "redis==8.1.0",
  "PyJWT==2.15.0",
  "argon2-cffi==25.1.0",
  "alembic==1.20.0",
  "SQLAlchemy==2.1.1",
  "PyYAML==6.0.3",
  "tzdata>=2025.2",
  # Increment 3: LLM gateway clients, RAG, L3 dedup, tracing.
  # langchain-chroma is installed by the Containerfile with --no-deps: it
  # declares the full chromadb (onnxruntime, kubernetes...), while the thin
  # HTTP client below is all it needs against the chroma server.
  "langchain==1.4.2",
  "langchain-core==1.6.5",
  "langchain-openai==1.6.6",
  "chromadb-client==1.5.9",
  "redisvl==0.27.2",
  "langfuse==4.15.6",
  "httpx==0.28.1",
  "numpy==2.5.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "fakeredis[lua]==2.38.0",
  "hypothesis==6.168.1",
  "pytest-benchmark==5.3.0",
  "ruff==0.11.8",
]

[project.scripts]
ai-api = "ai_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Google Python Style Guide (docs/Google_Python_Style_Guide_20260925.md).
# Same settings as vendor-sim. The rule ruff can't check, "import modules,
# not names" (2.2), is kept by review.
[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
select = [
  "E", "F", "W",  # pycodestyle, pyflakes
  "I",            # import order (3.13)
  "N",            # naming (3.16)
  "D",            # docstrings (3.8)
  "PL",           # pylint rules (2.1)
  "B", "UP", "SIM",
]
ignore = [
  "PLR09",    # too-many-*: disabled in Google's pylintrc too
  "PLR2004",  # magic-value comparison: not a Google rule
]

[tool.ruff.lint.per-file-ignores]
# Test modules and test functions need no docstrings (3.8.2.1).
"tests/**" = ["D100", "D103"]
"evals/**" = ["D103"]
# Alembic revision files use Alembic's module-level names.
"src/ai_api/migrations/**" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# One import per line, sorted by full module path within each group (3.13).
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["collections.abc", "typing"]
known-first-party = ["ai_api", "evals"]
