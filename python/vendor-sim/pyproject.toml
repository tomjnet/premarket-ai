[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "premarket-vendor-sim"
version = "0.1.0"
description = "Synthetic, labeled pre-market news vendor for premarket-ai"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "httpx==0.28.1",
  "ruff==0.11.8",
]

[project.scripts]
vendor-sim = "vendor_sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vendor_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
