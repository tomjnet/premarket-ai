[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "premarket-vendor-sim"
version = "0.1.0"
description = "Synthetic, labeled pre-market news vendor for premarket-ai"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "PyYAML==6.0.3",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "httpx==0.28.1",
  "ruff==0.11.8",
]

[project.scripts]
vendor-sim = "vendor_sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vendor_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Google Python Style Guide (docs/Google_Python_Style_Guide_20260925.md).
# ruff stands in for the guide's pylint run. The rule it can't check, "import
# modules, not names" (2.2), is kept by review.
[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
select = [
  "E", "F", "W",  # pycodestyle, pyflakes
  "I",            # import order (3.13)
  "N",            # naming (3.16)
  "D",            # docstrings (3.8)
  "PL",           # pylint rules (2.1)
  "B", "UP", "SIM",
]
ignore = [
  "PLR09",    # too-many-*: disabled in Google's pylintrc too
  "PLR2004",  # magic-value comparison: not a Google rule
]

[tool.ruff.lint.per-file-ignores]
# Test modules and test functions need no docstrings (3.8.2.1).
"tests/**" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# One import per line, sorted by full module path within each group (3.13).
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["collections.abc", "typing"]
known-first-party = ["vendor_sim"]
